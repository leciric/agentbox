# AgentBox's Linux machine on this Mac, made by `agentbox vm init`. The whole of
# AgentBox runs in here: the daemon, Incus and every agent. The Mac runs only
# the app and the agentbox command, which reach the daemon through the socket
# Lima forwards below.
#
# Regenerated from internal/hostvm/agentbox.yaml when the VM is made; to change
# the VM's CPUs and memory afterwards, `agentbox vm resize --cpus N --memory 16GiB`.
minimumLimaVersion: 2.0.0
base: template:debian-13
[[- if .VMType]]
vmType: [[.VMType]]
[[- end]]
cpus: [[.CPUs]]
memory: [[.Memory]]
disk: [[.Disk]]

# Lima's own containerd (nerdctl) is on by default; AgentBox runs Incus, and
# Docker inside each agent, and has no use for it.
containerd:
  system: false
  user: false

# The Mac's home directory, writable, at the same path: projects, their .git
# and the agents' worktrees keep their paths, which AgentBox mounts into each
# agent at those same paths.
mountType: virtiofs
mounts:
  - location: [[printf "%q" .Home]]
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      # agentbox host setup installs Incus; the daemon itself needs git, and
      # the rule below needs nft.
      if ! command -v git >/dev/null || ! command -v nft >/dev/null; then
        apt-get update -q
        apt-get install -y -q git ca-certificates nftables
      fi
      # Lima reaches the Mac's own 127.0.0.1 at host.lima.internal (192.168.5.2
      # with the networking it sets up by default). The VM needs that; agents
      # don't, and shouldn't see what the Mac serves only to itself. Every
      # boot, so the rule is there before any agent starts.
      mac=$(getent ahostsv4 host.lima.internal | awk 'NR == 1 { print $1 }' || true)
      mac=${mac:-192.168.5.2}
      nft delete table inet agentbox-host 2>/dev/null || true
      nft -f - <<EOF
      table inet agentbox-host {
        chain forward {
          type filter hook forward priority -10; policy accept;
          iifname "incusbr0" ip daddr $mac drop
        }
      }
      EOF
[[- if eq .VMType "krunkit"]]
  # krunkit hands the memory the VM frees back to the Mac (free page
  # reporting), but Linux keeps what it has read cached until it runs short,
  # so a VM that has built something holds on to it. Every 10 minutes, when
  # the VM has been quiet (its CPUs under 5% busy for half a minute) and caches
  # more than 1 GiB, this drops the page cache and the kernel's reclaimable
  # caches and compacts what's free into the whole blocks reporting returns:
  # what AgentBox's VM on Linux does when it's quiet (internal/hostvm/chv).
  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail
      cat >/usr/local/sbin/agentbox-reclaim <<'EOF'
      #!/bin/sh
      set -eu
      cached=$(awk '/^(Buffers|Cached|SReclaimable):/ { n += $2 } END { print n }' /proc/meminfo)
      [ "$cached" -ge 1048576 ] || exit 0
      read -r _ u1 n1 s1 i1 w1 q1 r1 t1 _ </proc/stat
      sleep 30
      read -r _ u2 n2 s2 i2 w2 q2 r2 t2 _ </proc/stat
      busy=$(( (u2 + n2 + s2 + q2 + r2 + t2) - (u1 + n1 + s1 + q1 + r1 + t1) ))
      total=$(( busy + (i2 + w2) - (i1 + w1) ))
      [ "$total" -gt 0 ] && [ $(( busy * 100 / total )) -lt 5 ] || exit 0
      sync
      echo 3 >/proc/sys/vm/drop_caches
      echo 1 >/proc/sys/vm/compact_memory
      EOF
      chmod 0755 /usr/local/sbin/agentbox-reclaim
      cat >/etc/systemd/system/agentbox-reclaim.service <<'EOF'
      [Unit]
      Description=Give the Mac back the memory AgentBox's VM keeps cached, when it's quiet
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/agentbox-reclaim
      EOF
      cat >/etc/systemd/system/agentbox-reclaim.timer <<'EOF'
      [Unit]
      Description=Give the Mac back the memory AgentBox's VM keeps cached, when it's quiet
      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=10min
      [Install]
      WantedBy=timers.target
      EOF
      systemctl daemon-reload
      systemctl enable --now agentbox-reclaim.timer
[[- end]]

# The daemon's socket, out to where the Mac's app and command look for it.
portForwards:
  - guestSocket: "{{.Home}}/.local/share/agentbox/run/agentbox.sock"
    hostSocket: [[printf "%q" .Socket]]
