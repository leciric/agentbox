<!-- The agents' desktop wallpaper: the app icon on a dark background.
     wallpaper.png next to it is rendered from this file (see wallpaper.go),
     and is what browser.sh puts on the root window. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#211a3d"/>
      <stop offset="0.55" stop-color="#121121"/>
      <stop offset="1" stop-color="#0b0b11"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>
  <ellipse cx="720" cy="410" rx="620" ry="430" fill="url(#glow)"/>

  <!-- Faint grid, so the flat background has some texture up close. -->
  <g stroke="#ffffff" stroke-opacity="0.028" stroke-width="1">
    <path d="M0 60H1440M0 180H1440M0 300H1440M0 420H1440M0 540H1440M0 660H1440M0 780H1440"/>
    <path d="M60 0V900M180 0V900M300 0V900M420 0V900M540 0V900M660 0V900M780 0V900M900 0V900M1020 0V900M1140 0V900M1260 0V900M1380 0V900"/>
  </g>

  <!-- The app icon, centred and a little above the middle. -->
  <g transform="translate(720 400)">
    <g transform="translate(-100 -100) scale(0.390625)">
      <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#mark)"/>
      <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#shine)"/>
      <g transform="translate(106 106) scale(12.5)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
        <path d="m3.3 7 8.7 5 8.7-5"/>
        <path d="M12 22V12"/>
      </g>
    </g>
  </g>

  <g font-family="Liberation Sans, DejaVu Sans, Helvetica, sans-serif" text-anchor="middle">
    <text x="720" y="568" fill="#f2f0ff" font-size="52" letter-spacing="14">AGENTBOX</text>
    <text x="720" y="610" fill="#a78bfa" fill-opacity="0.85" font-size="17" letter-spacing="6">A MACHINE OF YOUR OWN</text>
  </g>
  <rect x="560" y="638" width="320" height="1" fill="url(#rule)"/>
</svg>
