[package]
name = "agentbox-native"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Playing agents' recordings needs FFmpeg's libraries; checks for other
# platforms (CI's cross-target cargo check) build without it.
default = ["video"]
video = ["dep:ffmpeg-next"]

[dependencies]
agentbox-api.workspace = true
gpui.workspace = true
# Syntax colours in chat's code blocks (gpui-component's syntect backend),
# the diff and the file viewer (highlight.rs, with the same syntect and
# syntax set). Pure Rust, so the Windows check cross-compiles; tree-sitter's
# grammars are C and added 7.5 MB against syntect's 1.2 MB.
gpui-component = { workspace = true, features = ["syntect"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
gpui_platform.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
# ```mermaid blocks in chat, drawn natively (no webview): Mermaid → SVG.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# The Markdown AST gpui-component parses into, for custom blocks.
markdown = "1"
# Review's recordings (H.264 High in MP4): decoded by FFmpeg's own decoder.
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }
# The frame type GPUI's RenderImage takes (gpui-pre uses image 0.25).
image = { version = "0.25", default-features = false }
# ```html preview blocks: a webview (WebKitGTK, WKWebView, WebView2) as a
# child of the GPUI window.
wry = "0.57"
raw-window-handle = "0.6"
alacritty_terminal = "0.26"
vnc-rs = "0.6"
agentbox-i18n.workspace = true
humantime = "2"
# A file the viewer shows as an image comes base64 in its JSON (FileContent.data).
base64 = "0.22"
# PDFs in Files, drawn page by page in pure Rust (no runtime library).
hayro = "=0.8.0"
# Do not disturb ends at 8 tomorrow morning, the user's own time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The same WebKitGTK wry uses (pinned as wry pins it): pages drawn offscreen
# for ```html preview where child webviews can't be made (Wayland).
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
