[package]
name = "agentbox-office"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# The same wgpu GPUI draws with (gpui-pre-wgpu), so there is one in the tree.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"] }
gltf = { version = "1.4", default-features = false, features = ["utils"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
pollster = "0.4"
anyhow.workspace = true

[dev-dependencies]
gpui.workspace = true
gpui_platform.workspace = true
async-channel = "2"
image = { version = "0.25", default-features = false }
