name: CI

# The repository is private, so every job's minutes are billed, each rounded
# up to a whole minute, and macOS at 10x and Windows at 2x. So a run runs only
# what its changes can break: `changes` works out, with scripts/ci-changes.sh,
# which of Go, the desktop app and the phone app a change touches, and the
# jobs for the rest skip. macOS and Windows run on a push to main, or on a PR
# labelled ci:full, when the change reaches what they test. govulncheck runs
# weekly, on main, and on a PR that changes go.mod or go.sum. A change to this
# file or to scripts/ci-changes.sh runs everything.
on:
  push:
    branches: [main]
  pull_request:
    # labeled, for ci:full: that run is macOS and Windows alone, since the
    # PR's own run has done the rest.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 6 * * 1'
  # With `pr`, the run is that pull request's, on its branch: chv.yml
  # dispatches it for the pin PR it opens, which GITHUB_TOKEN can't get a
  # pull_request run for. Its checks land on the PR's head commit.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number, to run its checks as a pull_request would
        required: false

permissions:
  contents: read
  pull-requests: read

# A new push cancels the run it supersedes. Labelling has a group of its own,
# so that adding ci:full doesn't cancel the PR's run, nor any other label it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

jobs:
  # What a change touches, from the files GitHub lists for the PR or the push,
  # and so which jobs run. Anything it can't tell runs everything.
  #
  # The PR title is checked here too, rather than in a job of its own (a job
  # bills at least a minute). Squash merges use the PR title as the commit
  # message, and release-please turns that commit history into CHANGELOG.md
  # at release time (feat → Added, fix/perf → Fixed, refactor → Changed;
  # test/ci/docs/chore don't show up at all): the title has to be a
  # conventional commit on its own, independent of what the branch's commits
  # look like, and it has to read like a changelog line, since it may end up
  # as one verbatim.
  changes:
    name: Changes and PR title
    if: github.event_name != 'schedule' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.paths.outputs.go }}
      desktop: ${{ steps.paths.outputs.desktop }}
      mobile: ${{ steps.paths.outputs.mobile }}
      vuln: ${{ steps.paths.outputs.vuln }}
      macos: ${{ steps.paths.outputs.macos }}
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - name: Check the title is a conventional commit
        if: github.event_name == 'pull_request' || inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ inputs.pr }}
        run: |
          [ -n "$PR" ] && TITLE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          if [[ ! "$TITLE" =~ ^(feat|fix|refactor|docs|chore|test|perf|ci)(\(.+\))?!?:\ .+ ]]; then
            echo "PR title isn't a conventional commit (feat|fix|refactor|docs|chore|test|perf|ci): $TITLE" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      # Whether macOS and Windows can be affected takes Go, to list the
      # packages they test, so it's worked out only where they may run: on
      # main, and on a PR labelled ci:full (adding the label runs them
      # anyway). Without Go, scripts/ci-changes.sh runs them.
      - id: platforms
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$EVENT" = push ] || { [ "$FULL_LABEL" = true ] && [ "$ACTION" != labeled ]; }; then p=true; else p=false; fi
          echo "platforms=$p" >>"$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v5
        if: steps.platforms.outputs.platforms == 'true'
        continue-on-error: true
        with:
          install_args: go

      # What each half reads, and so what can break it, is in
      # scripts/ci-changes.sh.
      - name: What the change touches
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          BEFORE: ${{ github.event.before }}
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: |
          files=$(mktemp)
          ok=true
          case "$EVENT" in
            pull_request|workflow_dispatch)
              if [ -n "$PR" ]; then
                gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' >"$files" || ok=false
              else
                ok=false
              fi ;;
            push)
              if [[ "$BEFORE" =~ ^0+$ ]]; then
                ok=false
              else
                compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA") || ok=false
                # The compare API lists at most 300 files.
                if $ok && [ "$(jq '.files | length' <<<"$compare")" -lt 300 ]; then
                  jq -r '.files[].filename' <<<"$compare" >"$files"
                else
                  ok=false
                fi
              fi ;;
            *) ok=false ;;
          esac
          if ! $ok || [ ! -s "$files" ]; then
            echo "Can't tell what changed: running everything"
            go=true desktop=true mobile=true vuln=true macos=true windows=true
          else
            sed 's/^/  /' "$files"
            # Lines of key=true|false.
            eval "$(scripts/ci-changes.sh "$files")"
          fi
          # On main, govulncheck follows Go. Labelling a PR ci:full runs
          # macOS and Windows whatever the change, and nothing else.
          [ "$EVENT" = push ] && vuln=$go
          if [ "$EVENT/$ACTION" = pull_request/labeled ] || { [ "$EVENT" = workflow_dispatch ] && [ -z "$PR" ]; }; then
            macos=true windows=true
          fi
          printf '%s\n' "go=$go" "desktop=$desktop" "mobile=$mobile" "vuln=$vuln" "macos=$macos" "windows=$windows" | tee -a "$GITHUB_OUTPUT"

  # The Go test suite, once, with coverage: scripts/check-coverage.sh fails
  # below the floor in .github/coverage-floor.txt. This includes
  # TestTypeScriptTypesAreUpToDate, which keeps desktop/src/shared/api.ts
  # generated from internal/api.
  #
  # Caches are saved by main's runs only, keyed by commit, and restored by
  # everyone from main's latest: a PR's run never saves one of its own, and
  # the cache follows main rather than freezing at the first go.sum it saw.
  # Test results are in the build cache, so a package no change reaches
  # isn't tested again: the coverage floor still sees every package, from
  # the cache's results.
  go-test:
    name: Go tests and coverage
    needs: changes
    if: needs.changes.outputs.go == 'true' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Go's version comes from mise.toml, so CI and a checkout can't drift.
      # ttyd and pnpm are the host's tools, and nothing here needs them.
      - uses: jdx/mise-action@v5
        with:
          install_args: go

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-

      # TestRecordingsPlayInChromium encodes with a recording's own arguments
      # and checks the file with ffprobe; without them it skips.
      - timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -q --no-install-recommends ffmpeg

      # The tests' temporary files, their SQLite databases first, on a tmpfs,
      # as in an agent's machine: on disk, every fsync waits, and the slow
      # packages take minutes rather than seconds.
      - name: Temporary files in memory
        run: |
          sudo mkdir -p /t
          sudo mount -t tmpfs -o size=8g,mode=1777 tmpfs /t
          echo TMPDIR=/t >>"$GITHUB_ENV"

      # A test that opens a file in the repository (testdata/, api.ts, a
      # package's own files) is cached by that file's size and mtime, and a
      # checkout gives every file a new mtime: those packages, internal/agent
      # and internal/daemon among them, were tested again on every run. Each
      # file's and directory's mtime from its git object id instead, so it
      # changes when, and only when, the content does.
      - name: Files' times from their contents
        run: |
          python3 - <<'EOF'
          import os, subprocess
          def mtime(oid):  # 1990 to 2007, to the nanosecond
              h = int(oid[:16], 16)
              return (631152000 + (h >> 34) % (1 << 29)) * 10**9 + (h & (1 << 30) - 1) % 10**9
          git = lambda *a: subprocess.run(["git", *a], capture_output=True, check=True).stdout
          dirs = [(b".", mtime(git("rev-parse", "HEAD^{tree}").strip()))]
          for entry in git("ls-tree", "-r", "-t", "-z", "HEAD").split(b"\0")[:-1]:
              meta, path = entry.split(b"\t", 1)
              _, kind, oid = meta.split()
              if kind == b"tree":
                  dirs.append((path, mtime(oid)))
              elif kind == b"blob":
                  os.utime(path, ns=(mtime(oid),) * 2, follow_symlinks=False)
          for path, ns in reversed(dirs):
              os.utime(path, ns=(ns, ns))
          EOF

      - run: scripts/check-coverage.sh

      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # Everything about the Go code but its tests, beside them so neither waits
  # for the other: vet, golangci-lint, go mod tidy, and the builds for a Mac.
  go-check:
    name: Go vet, lint, tidy
    needs: changes
    if: needs.changes.outputs.go == 'true' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: go

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-check-${{ runner.os }}-

      - run: go mod tidy

      - name: go.mod and go.sum must already be tidy
        run: git diff --exit-code go.mod go.sum

      - run: go vet ./...

      # The Incus tests are behind the `integration` build tag, so no ordinary
      # build sees them and this runner can't run them. Vetting them with the
      # tag at least keeps them compiling against the code they test.
      - run: go vet -tags integration ./...

      # Pinned to the version this repo's .golangci.yml was written and
      # checked clean against. It caches its own analysis.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # On a Mac, agentbox is the front end of AgentBox's Linux VM
      # (internal/hostvm), and the VM runs the arm64 Linux build; on Windows,
      # of a WSL distro: all have to keep compiling, whatever this runner is.
      # Without cgo, which only the macOS job has, so the vz driver is checked
      # there. Vetting every package for a Mac and building for Windows here
      # is what lets those jobs skip a change that doesn't reach the packages
      # they test (scripts/ci-changes.sh).
      - name: Build for a Mac, its VM, and Windows
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/agentbox
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/agentbox
          GOOS=windows GOARCH=amd64 go vet ./cmd/agentbox ./internal/hostos ./internal/hostwsl/...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/agentbox

      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # Weekly, on main, and on a PR that changes the modules: a vulnerability is
  # news about a dependency, not about a change to this code.
  vulncheck:
    name: govulncheck
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.changes.result == 'success' && needs.changes.outputs.vuln == 'true' && github.event.action != 'labeled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: go

      - uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-

      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Nothing here launches Electron — only lint, typecheck, test and
      # bundle — so skip the ~100 MB runtime npm would otherwise fetch on
      # install. The release workflow, which packages the AppImage, does not
      # set this.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm --prefix desktop ci --no-audit --no-fund

      - run: npm --prefix desktop run lint

      - run: npm --prefix desktop run typecheck

      - run: npm --prefix desktop test

      # The main process, the preload script and the renderer, into out/.
      # Packaging the AppImage takes minutes and belongs to the release.
      - run: npm --prefix desktop run build

      # The live view of `agentbox machines serve` is the app's VNC client,
      # bundled into the Go binary's page and committed: it must match.
      - name: internal/machinesweb/static/vnc.js is up to date
        run: |
          npm --prefix desktop run build:machines-view
          git diff --exit-code internal/machinesweb/static/vnc.js || {
            echo "::error::Run npm --prefix desktop run build:machines-view and commit internal/machinesweb/static/vnc.js"
            exit 1
          }

  # The phone app (mobile/): lint, typecheck and its tests. Its typecheck
  # reads the desktop's shared/ (the API's types and the text's catalogs),
  # which it imports. Nothing here needs a simulator.
  mobile:
    name: Phone app
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: npm-mobile-${{ runner.os }}-

      - run: npm --prefix mobile ci --no-audit --no-fund

      - run: npm --prefix mobile run lint

      - run: npm --prefix mobile run typecheck

      - run: npm --prefix mobile test

  # The macOS agentbox, as a release builds it: with cgo, which the
  # experimental vz driver's bindings to Apple's Virtualization framework need
  # (internal/hostvm/chv/vz_darwin.go), for Apple silicon and Intel, and
  # signed with its entitlement. The unit tests run here too, and the vz
  # driver's own with a test binary signed the same way. The runner can't
  # boot a VM: what only a real Mac shows is in the vz driver's PR.
  # At 10x a Linux minute, it runs on main and on a PR labelled ci:full, when
# the change reaches what it builds and tests (scripts/ci-changes.sh).
  macos:
    name: Go on macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: go

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Build the macOS agentbox, with cgo, and sign it
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          GOARCH=arm64 go build -o bin/agentbox-arm64 ./cmd/agentbox
          GOARCH=amd64 go build -o bin/agentbox-amd64 ./cmd/agentbox
          scripts/mac-sign.sh bin/agentbox-arm64 bin/agentbox-amd64
          bin/agentbox-arm64 --version
          bin/agentbox-arm64 vm init --help | grep -q -- '--driver'

      # The front end's own tests, on the OS they're for: they drive a fake
      # limactl and fake VMs, so no VM is made.
      - name: Unit tests
        env:
          CGO_ENABLED: "1"
        run: go test ./internal/hostvm/... ./internal/paths ./internal/api

      # The vz driver's configuration, validated by the framework, and its
      # checks, from a test binary signed with the entitlement as agentbox is.
      - name: The vz driver, signed
        env:
          CGO_ENABLED: "1"
        run: |
          go test -c -o bin/chv.test ./internal/hostvm/chv
          scripts/mac-sign.sh bin/chv.test
          AGENTBOX_TEST_SIGNED=1 bin/chv.test -test.run 'VZ' -test.v

      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # The Windows front end (D94): agentbox.exe, which runs everything else in a
  # WSL distro, and the relay the app reaches the daemon through. Its tests
  # run the relay end to end against fakewsl, a stand-in for wsl.exe, over a
  # real named pipe — which wine can't do, so this is the only place it runs.
  # GitHub's Windows runners have no nested virtualisation, so no WSL 2 and no
  # real distro: that part is checked by hand (see PR #94).
  # At 2x a Linux minute, it runs on main and on a PR labelled ci:full, when
# the change reaches what it builds and tests (scripts/ci-changes.sh).
  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: go

      - run: go vet ./cmd/agentbox ./internal/hostos ./internal/hostwsl/...

      - run: go test ./internal/hostos ./internal/hostwsl/...

      - run: go build -o bin/agentbox.exe ./cmd/agentbox

      - run: bin/agentbox.exe --version

      # What the runner has of WSL, for the log: nothing here depends on it.
      - run: |
          wsl --status
          bin/agentbox.exe wsl status
        continue-on-error: true
