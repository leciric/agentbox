name: Release

# release-please (D95) watches every push to main: it keeps a "release PR"
# up to date, bumping desktop/package.json and desktop/package-lock.json's two
# root version fields and rewriting CHANGELOG.md from the conventional commits
# (squash-merged PR titles) since the last release, grouped by
# .github/release-please-config.json's changelog-sections. Merging that PR is
# what releasing means now: the merge is itself a push to main, so the same
# workflow run that updates the release PR also notices, on the next run,
# that a release was just made — release-please tags the merge commit and
# opens the GitHub release as a draft, and this workflow's build jobs take it
# from there, uploading assets and only then taking the draft off. A run
# where release-please only updated the PR skips every build job, `if:` its
# release_created output.
#
# release-please pushes its tag with GITHUB_TOKEN, which GitHub doesn't let
# trigger other workflows — irrelevant here, since the build jobs are steps of
# this same run, not a workflow the tag push would have to trigger.
#
# CI (ci.yml) does not run on the release PR itself, since release-please
# opens and updates it with GITHUB_TOKEN too, whose own pushes don't trigger
# workflows either: close it and reopen it (no need to touch its branch) to
# get a CI run on it before merging.
#
# A draft release (D95's "draft": true) doesn't get its tag created until
# it's published — GitHub's own "lazy tag creation" — so the config also sets
# "force-tag-creation": true, and release-please tags the merge commit itself
# as part of drafting the release. If a run's builds still fail after that (or
# release-please's own step didn't get to run, as on 0.6.0), workflow_dispatch
# with a `tag` input re-runs the same build and publish jobs against that
# draft's existing tag, creating it at the draft's target commit first if it's
# somehow still missing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing draft release to build and publish (e.g. v0.6.0)'
        required: true
        type: string

# The repository's default GITHUB_TOKEN is read-only: release-please needs to
# open its PR and draft the release, and the jobs below push the tag, upload
# the files and publish.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  # Whichever trigger this run is: on a push, release-please's own outputs; on
  # a manual dispatch, the draft release named by the `tag` input, tagging it
  # at its target commit first if release-please's "force-tag-creation"
  # somehow didn't (a draft made before that setting landed, say). This is
  # what every job below reads, instead of release-please's directly, so they
  # don't need to know which trigger started them.
  release:
    name: Resolve the release to build
    needs: release-please
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_created: ${{ steps.resolve.outputs.release_created }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_TAG: ${{ inputs.tag }}
      PUSH_RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
      PUSH_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve
        id: resolve
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
            is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "::error::$tag is not a draft release"
              exit 1
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              target=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')
              # Through the API: the checkout is shallow, so the target
              # commit usually isn't in it.
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq '.sha')
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            echo "release_created=true" >>"$GITHUB_OUTPUT"
            echo "tag_name=$tag" >>"$GITHUB_OUTPUT"
          else
            echo "release_created=$PUSH_RELEASE_CREATED" >>"$GITHUB_OUTPUT"
            echo "tag_name=$PUSH_TAG_NAME" >>"$GITHUB_OUTPUT"
          fi

  # A quick sanity check before the build jobs below spend minutes each:
  # the tag to build is there, its release is still a draft, and the
  # checkout is clean.
  checks:
    name: Checks
    needs: release
    # always(): on a manual run release-please is skipped, and a skipped job
    # anywhere upstream skips everything below it unless the condition says
    # otherwise.
    if: always() && needs.release.result == 'success' && needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: jdx/mise-action@v5
        with:
          install_args: go node

      - name: Check the release
        run: scripts/release-build.sh --tag "$TAG" --check

  # The AppImage, the .deb, the .pacman and the command-line tool for Linux
  # (amd64, arm64) — all plain cross-compiles, so they don't need to wait on
  # the Mac job, which builds the macOS command-line tool (it needs cgo).
  linux:
    name: Linux build
    needs: [release, checks]
    if: always() && needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: jdx/mise-action@v5
        with:
          install_args: go node

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
          key: release-npm-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: release-npm-${{ runner.os }}-

      # bsdtar: electron-builder prefers it for unpacking the Electron
      # distribution, and fpm needs it to make the .pacman.
      - name: Install what electron-builder wants
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libarchive-tools

      - run: npm --prefix desktop ci

      - name: Build the Linux release
        run: scripts/release-build.sh --tag "$TAG" --linux

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: desktop/dist/release/${{ needs.release.outputs.tag_name }}/
          if-no-files-found: error

  # The Windows installer and portable .exe. electron-builder makes these on
  # Linux, through wine, so this doesn't need a Windows runner — only wine,
  # which the Linux job above no longer has to install.
  windows:
    name: Windows build
    needs: [release, checks]
    if: always() && needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: jdx/mise-action@v5
        with:
          install_args: go node

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
          key: release-npm-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: release-npm-${{ runner.os }}-

      # bsdtar, which electron-builder prefers for unpacking the Electron
      # distribution and warns about when it's missing. It brings its own 7z
      # and AppImage runtime, unused here. Wine runs the 32-bit NSIS installer
      # electron-builder makes to get the uninstaller out of it, so it needs
      # wine32 too.
      - name: Install what electron-builder wants
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libarchive-tools wine wine32:i386 wine64

      - run: npm --prefix desktop ci

      - name: Build the Windows release
        run: scripts/release-build.sh --tag "$TAG" --windows

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: desktop/dist/release/${{ needs.release.outputs.tag_name }}/
          if-no-files-found: error

  # The Mac app, built on a Mac (electron-builder makes .dmg files only there),
  # for Apple silicon and Intel, from the tag release-please made. It's signed
  # and notarized when the repository has Apple's credentials as secrets;
  # without them, it's ad hoc signed instead of left unsigned (see
  # desktop/scripts/dist.mjs) and shipped anyway, since an unsigned Mac app
  # doesn't even launch on Apple silicon. The macOS command-line tool is built
  # here too, with cgo, and signed the same way with the Virtualization
  # entitlement the experimental vz driver needs (scripts/mac-sign.sh).
  macos:
    name: Mac app
    needs: [release, checks]
    if: always() && needs.checks.result == 'success'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: jdx/mise-action@v5
        with:
          install_args: go node

      - run: npm --prefix desktop ci

      - name: Build the Mac app
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No signing certificate: building an ad hoc signed, unnotarized app"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm --prefix desktop run dist -- --mac --arm64 --x64

      # With the app's certificate, in a keychain of this job's own, when the
      # repository has it: Developer ID, the hardened runtime and a timestamp,
      # then notarized. Without it, ad hoc, like the app.
      - name: Build the command-line tool for a Mac
        run: |
          if [ -n "$CSC_LINK" ]; then
            keychain=$RUNNER_TEMP/agentbox.keychain-db
            password=$(openssl rand -hex 16)
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            echo "$CSC_LINK" | base64 --decode >"$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            MAC_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
            [ -n "$MAC_SIGN_IDENTITY" ] || { echo "::error::the certificate has no Developer ID Application identity"; exit 1; }
            export MAC_SIGN_IDENTITY
          else
            echo "::warning::No signing certificate: the command-line tool is signed ad hoc, and not notarized"
          fi
          scripts/release-build.sh --tag "$TAG" --mac-cli
          if [ -n "${MAC_SIGN_IDENTITY:-}" ] && [ -n "$APPLE_ID" ]; then
            for f in desktop/dist/release/"$TAG"/agentbox-*-darwin-*; do
              ditto -c -k "$f" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              rm -f "$RUNNER_TEMP/notarize.zip"
            done
          fi

      - name: Collect it
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          mkdir -p mac
          cp desktop/dist/AgentBox-"$version"-mac-*.dmg desktop/dist/AgentBox-"$version"-mac-*.zip mac/
          cp desktop/dist/release/"$TAG"/agentbox-"$version"-darwin-* mac/
          cd mac
          shasum -a 256 * >SHA256SUMS-mac
          cat SHA256SUMS-mac

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: mac/
          if-no-files-found: error

  # Everything at once: once linux, windows and macos have all succeeded,
  # upload their assets to the draft release release-please made and take it
  # off draft. `skipped` is only there for when checks itself fails, which
  # skips all three builds too; that case is already excluded by the two
  # `== 'success'` checks below. Needs `always()`, since a skipped macos would
  # otherwise skip this job too. Nothing is published if any build fails: the
  # release stays a draft, visible to collaborators only, until a rerun of
  # this workflow gets all three green.
  publish:
    name: Publish
    needs: [release, linux, windows, macos]
    if: >-
      always() &&
      needs.release.outputs.release_created == 'true' &&
      needs.linux.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/download-artifact@v8
        with:
          pattern: linux
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: windows
          path: out
          merge-multiple: true

      - name: Sum the Linux and Windows assets
        run: (cd out && sha256sum AgentBox-* agentbox-* >SHA256SUMS && cat SHA256SUMS)

      - uses: actions/download-artifact@v8
        with:
          pattern: mac
          path: out
          merge-multiple: true

      - name: Upload the assets and publish the release
        run: |
          gh release upload "$TAG" out/* --clobber
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'

  # The repository is private, so its releases answer nobody but its
  # collaborators: users download from the Cloudflare R2 bucket
  # agentbox-releases (https://downloads.agentbox.linting.dev), and the app
  # checks for updates there (internal/update's DefaultReleasesURL). Its own
  # job, so that a rerun after a failure here leaves GitHub's release alone.
  # One at a time with the other workflow's, since both rewrite releases.json.
  r2:
    name: Copy to R2
    needs: [release, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: r2-releases
      cancel-in-progress: false
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Upload the release and rewrite releases.json
        run: scripts/r2-publish.sh "$TAG"
