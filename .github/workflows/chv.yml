# Builds AgentBox's Cloud Hypervisor (scripts/chv-gpu/build.sh): upstream's
# v53.0 with Spectrum OS's virtio-gpu patchset rebased onto it, crosvm's GPU
# device and virglrenderer, which every Linux install, nightly or release,
# downloads (internal/hostvm/chv/tools.go, chvBundle) by a pinned SHA256.
# Modelled on the base image's workflows, and nothing to run by hand:
#
#   - On a PR that changes its inputs: build it, and check the binaries take
#     AgentBox's command lines (test/chv_args_test.sh, which also compares
#     Cloud Hypervisor with upstream's v53.0 on the VM's line without the GPU).
#   - On main, when its inputs changed: build it, publish it as the release
#     chv-<version>-<hash of its inputs> unless that's published already
#     (never replaced: publish.sh), and open a pull request pinning the
#     published build in tools.go (pin.sh) when main doesn't pin it yet.
#     crosvm doesn't build byte for byte alike twice, so the pin can only
#     follow the publishing.
#
# Nightly and release builds refuse a pin that isn't published
# (check-published.sh). workflow_dispatch is the same as a push, as an extra.
# Docker's layers are cached in GitHub's cache, so a run whose inputs barely
# changed rebuilds little.
name: Cloud Hypervisor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/chv-gpu/**
      - internal/hostvm/chv/tools.go
      - .github/workflows/chv.yml
  push:
    branches: [main]
    paths:
      - scripts/chv-gpu/build.sh
      - scripts/chv-gpu/Dockerfile
      - scripts/chv-gpu/fetch-git.sh
      - scripts/chv-gpu/package.sh
      - scripts/chv-gpu/versions.env
      - scripts/chv-gpu/inputs-hash.sh
      - scripts/chv-gpu/publish.sh
      - scripts/chv-gpu/pin.sh
      - scripts/chv-gpu/patches/**
      - scripts/chv-gpu/test/render-node-path.sh
      - internal/hostvm/chv/tools.go
      - .github/workflows/chv.yml

permissions:
  contents: read

concurrency:
  group: chv-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: go

      - name: Its inputs' hash, which names it
        id: hash
        run: echo "hash=$(scripts/chv-gpu/inputs-hash.sh)" >>"$GITHUB_OUTPUT"

      # Inputs that are published already (a pin pull request, its merge, a
      # change to tools.go alone) don't build again: the published tarball is
      # checked instead, and nothing is published or pinned.
      - name: Is this build published already?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/chv-gpu/versions.env
          tag=chv-$CHV_VERSION-${{ steps.hash.outputs.hash }}
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir out
            gh release download "$tag" --pattern '*-x86_64.tar.gz' --dir out
            echo "published=true" >>"$GITHUB_OUTPUT"
          else
            echo "published=false" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.published != 'true'
        uses: docker/setup-buildx-action@v3

      # The cache backend's token and URL, for buildx's type=gha.
      - if: steps.published.outputs.published != 'true'
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build (Docker, layers cached in GitHub's cache)
        if: steps.published.outputs.published != 'true'
        env:
          CARGO_BUILD_JOBS: 4
          DOCKER_BUILD_FLAGS: --cache-from type=gha,scope=chv --cache-to type=gha,scope=chv,mode=max
        run: scripts/chv-gpu/build.sh out

      - if: steps.published.outputs.published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chv
          path: out
          compression-level: 0
          retention-days: 7

      # Ubuntu 24.04 keeps unprivileged user namespaces from unconfined
      # programs, which the fake /dev/kvm needs.
      - name: The binaries take AgentBox's command lines
        run: |
          sudo sysctl -q kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get -q install -y libepoxy0 libgbm1 libvulkan1 >/dev/null
          scripts/chv-gpu/test/chv_args_test.sh out/*.tar.gz
          scripts/chv-gpu/test/parse_test.sh

  publish:
    name: Publish and pin
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: chv-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HASH: ${{ needs.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: chv
          path: out

      - name: Publish, unless this build's inputs are published already
        id: publish
        run: echo "tarball=$(scripts/chv-gpu/publish.sh out | tail -n1)" >>"$GITHUB_OUTPUT"

      - name: Check it's there as published
        run: |
          tarball=${{ steps.publish.outputs.tarball }}
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$(basename "$tarball" -x86_64.tar.gz)/$(basename "$tarball")
          [ "$(curl -fsSL --retry 5 "$url.sha256" | cut -d' ' -f1)" = "$(sha256sum "$tarball" | cut -d' ' -f1)" ]

      # A pull request opened with GITHUB_TOKEN runs no workflows, so CI is
      # dispatched on its branch, for that pull request (ci.yml's `pr`): its
      # checks land on the branch's head commit, which the PR shows. Until
      # it's merged, main pins the build before, which is published, so
      # nightlies keep building.
      - name: Open a pull request pinning it
        run: |
          out=$(scripts/chv-gpu/pin.sh "${{ steps.publish.outputs.tarball }}")
          echo "$out"
          git diff --quiet internal/hostvm/chv/tools.go && exit 0
          branch=chv-pin-$HASH
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qm "chore: pin Cloud Hypervisor build $HASH" internal/hostvm/chv/tools.go
          git push -f origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            gh pr create --head "$branch" --base main --title "chore: pin Cloud Hypervisor build $HASH" \
              --body "Pins the Cloud Hypervisor build the Cloud Hypervisor workflow published from $GITHUB_SHA (release \`chv-*-$HASH\`) in \`internal/hostvm/chv/tools.go\`: the tarball's SHA256 and its files'. Opened by the workflow, which also dispatches CI on this branch."
          fi
          # Also when the PR already exists: a force-push of the branch
          # starts no run of its own either.
          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          gh workflow run ci.yml --ref "$branch" -f pr="$pr"
