# Builds the machine every agent is copied from, the way a new machine does,
# whenever what goes into it changes. It publishes nothing: the image holds
# software AgentBox may not redistribute (Claude Code first of all), so every
# machine builds its own, and this only checks that provision.sh and
# personalise.sh still make one.
name: Base image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/image/**
      - .github/workflows/base-image.yml
  push:
    branches: [main]
    paths:
      - internal/image/**
      - .github/workflows/base-image.yml

permissions:
  contents: read

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Base image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Go's version comes from mise.toml, as in the CI and Release workflows.
      - uses: jdx/mise-action@v2
        with:
          install_args: go

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build the command-line tool
        run: go build -o bin/agentbox ./cmd/agentbox

      # The image is a few GB unpacked.
      - name: Make room for it
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # The same script a new machine runs: Incus, the storage pool, the bridge,
      # the subuid/subgid entries `image build` checks for, and the Docker
      # firewall rule without which containers on the Incus bridge get no
      # network.
      - name: Set the host up, the way a new machine does
        run: |
          sudo "$PWD/bin/agentbox" host setup
          incus version || true

      # Host setup puts the runner in incus-admin, which only applies to a new
      # login: sg gives this shell the group without one. The daemon the first
      # command starts inherits it, and the steps after this reach that daemon.
      - name: Make the image
        run: sg incus-admin -c "$PWD/bin/agentbox image build"

      - name: What the agents got
        if: always()
        run: sg incus-admin -c "incus list" || true
